[build]
  # Build command for your React app
  command = "npm run build"
  # Directory containing the built files
  publish = "dist"
  # Base directory for the build
  base = "frontend/"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  # Environment variable for API
  VITE_API_BASE_URL = "http://localhost:8000/api"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  # Development server command
  command = "npm run dev"
  # Port for development server
  port = 5174
  # Port for Netlify dev server
  targetPort = 5174
