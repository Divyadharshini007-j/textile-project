services:
  # Backend API Service
  - type: web
    name: textile-backend
    env: docker
    repo: https://github.com/Divyadharshini007-j/Textile-project.git
    rootDir: backend
    dockerContext: backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

  # PostgreSQL Database
  - type: pserv
    name: textile-db
    env: postgres
    plan: free
